plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fudai.auto'
    compileSdk 34

    defaultConfig {
        applicationId "com.fudai.auto"
        minSdk 24        // 支持安卓 7.0 及以上
        targetSdk 33     // 保持 33，保证前台服务在 Android 14 上可正常启动
        versionCode 5
        versionName "5.0"   // v5 = 修复手势权限（canPerformGestures），坐标点击真正生效
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// 核心功能全部使用系统 API，无需任何第三方依赖
dependencies {
}
